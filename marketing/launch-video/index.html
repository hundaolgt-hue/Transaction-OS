<!doctype html>
<html><head><meta charset="utf-8">
<title>Rapha ProjectControl Launch</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--amber:#E8A447;--amber2:#D98E2B;--blue:#5B8FE8;--navy:#0F2A44;--ink:#F5F7FA;--mute:#8C96A6;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
body{font-family:'Inter','Noto Sans Ethiopic','DejaVu Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#020307}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 50%;display:none}
.center{left:0;width:1080px;text-align:center}
.w,.ch{display:inline-block;will-change:transform,opacity,filter}
.mono{font-family:'JetBrains Mono',monospace}
.tn{font-variant-numeric:tabular-nums}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--amber)}
.h1{font-weight:700;font-size:104px;line-height:1.04;letter-spacing:-.045em;color:#fff}
.h2{font-weight:700;font-size:84px;line-height:1.06;letter-spacing:-.04em;color:#fff}
.h3{font-weight:600;font-size:60px;line-height:1.1;letter-spacing:-.03em;color:#fff}
.acc{background:linear-gradient(180deg,#FFD596 0%,#E8A447 55%,#C9781D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.grad{background:linear-gradient(180deg,#FFFFFF 30%,#AEB8C6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cap{font-size:30px;font-weight:400;color:var(--mute);letter-spacing:-.005em}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
/* bg */
.orb{position:absolute;border-radius:50%;width:1600px;height:1600px;left:-800px;top:-800px}
#grain{position:absolute;inset:0;opacity:.075;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%);pointer-events:none}
#bug{position:absolute;left:0;width:1080px;top:1808px;text-align:center;font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.38);font-weight:500}
#bug b{color:var(--amber);font-weight:600}
/* helix */
.card{position:absolute;left:-160px;top:-38px;width:320px;height:76px;border-radius:18px;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1.5px solid rgba(255,255,255,.14);backface-visibility:hidden}
.card b{font-family:'JetBrains Mono';font-weight:500;font-size:22px;color:var(--amber);min-width:36px}
.card span{font-size:25px;font-weight:600;color:#fff;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod{position:absolute;left:90px;width:900px;height:84px;display:flex;align-items:center;gap:28px}
.mod i{font-style:normal;width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--amber);
  background:rgba(232,164,71,.10);border:1px solid rgba(232,164,71,.35);font-family:'DejaVu Sans'}
.mod span{font-size:44px;font-weight:600;letter-spacing:-.025em;flex:1}
.mod em{font-style:normal;font-family:'JetBrains Mono';font-size:24px;color:var(--mute)}
/* table */
.tbl{position:absolute;left:0;top:0;width:960px;height:640px;overflow:hidden}
.trow{position:absolute;left:0;width:960px;height:56px;display:flex;align-items:center;font-size:22px;border-top:1px solid rgba(255,255,255,.06)}
.trow div{padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead{font-family:'JetBrains Mono';font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-top:none}
.c1{width:132px;font-family:'JetBrains Mono';color:var(--amber);font-size:19px}.c2{width:340px;color:#E7EBF0}.c3{width:70px;color:var(--mute)}
.c4{width:124px;text-align:right}.c5{width:116px;text-align:right}.c6{width:168px;text-align:right;font-weight:600;color:#fff}
.num{font-variant-numeric:tabular-nums}
/* bars */
.bar-row{position:absolute;left:70px;width:940px;height:64px}
.bar-row .lb{position:absolute;left:0;top:10px;font-size:30px;font-weight:500;color:#E7EBF0;letter-spacing:-.01em}
.bar-row .tr{position:absolute;left:250px;top:24px;width:530px;height:16px;border-radius:8px;background:rgba(255,255,255,.06)}
.bar-row .fl{position:absolute;left:0;top:0;height:16px;border-radius:8px;transform-origin:0 50%}
.bar-row .vl{position:absolute;right:0;top:12px;font-family:'JetBrains Mono';font-size:26px;color:#fff;text-align:right}
/* gantt */
.grow{position:absolute;left:0;width:1000px;height:40px}
.grow .gid{position:absolute;left:24px;top:9px;font-family:'JetBrains Mono';font-size:15px;color:var(--mute);width:120px}
.grow .gnm{position:absolute;left:142px;top:7px;font-size:19px;color:#E7EBF0;width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar{position:absolute;top:12px;height:16px;border-radius:5px;transform-origin:0 50%}
.gms{position:absolute;top:11px;width:18px;height:18px;transform-origin:50% 50%;margin-left:-9px}
/* tiles */
.tile{position:absolute;width:470px;height:470px;border-radius:36px;padding:44px}
.tile .tv{font-size:150px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.tile .tl{font-size:32px;font-weight:600;margin-top:18px;letter-spacing:-.015em}
.tile .ts{font-size:24px;color:var(--mute);margin-top:8px;line-height:1.3}
.tile .tk{font-family:'JetBrains Mono';font-size:20px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin-bottom:26px}
/* dashboard */
.dk{position:absolute;border-radius:24px;padding:26px 28px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.dk .k{font-family:'JetBrains Mono';font-size:16px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.dk .v{font-size:66px;font-weight:700;letter-spacing:-.045em;margin-top:10px;font-variant-numeric:tabular-nums}
.dk .pb{position:absolute;left:28px;right:28px;bottom:26px;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.dk .pb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transform-origin:0 50%}
.chip{position:absolute;height:96px;border-radius:22px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);text-align:center;padding-top:14px}
.chip b{display:block;font-size:40px;font-weight:700;letter-spacing:-.03em}
.chip span{font-family:'JetBrains Mono';font-size:14px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
</style></head>
<body><div id="stage"></div>
<script>
// ===================== DATA (from Rapha_ProjectControl_Sample.xlsx) =====================
const SHEETS=["00 Start","01 Dashboard","02 Setup","03 Contract Data","04 Parties","05 Personnel","06 Securities","07 Insurance","08 Calendar","09 Check","10 BOQ","11 BOQ Summary","12 Resources","13 Rate Build-up","14 Rate Analysis","15 Tender Check","16 WBS Map","17 Actual Costs","18 Cost Report","20 Activities","21 CPM","22 Gantt","23 Look-ahead","24 Histogram","25 Progress Update","26 Delay Log","27 MSP Export","30 IPC","31 Measurement","32 Statement","33 IPC by Bill","34 Payments","35 Ret & Adv","36 MOS","37 Price Adj","38 Cash Flow","39 Advance Request","40 Instructions","41 RFI","42 VO Pricing","43 VO Register","44 Dayworks","45 Notices","46 EOT","47 Letters","50 Site Diary","51 Diary Print","52 Returns","53 Materials","54 Weather","55 Subcontractors","56 Weekly Report","60 IR Register","61 Tests","62 Material Approvals","63 NCR","64 HSE Log","65 Incidents","66 HSE Stats","70 Drawings","71 Submittals","72 Correspondence","73 Minutes","74 Permits","75 Method Statements","76 Doc Register","80 Monthly Report","81 Owner Summary","82 Alerts","90 Snag List","91 Handover Register","92 Defects","93 Retention Release","94 Final Account","95 Closeout","96 Forms","X1 IPC Ledger","X2 Letter Library","X3 Form Library","X4 Lists"];

const BOQ=[["B1-E-02","Bulk excavation in ordinary soil to 1.50 m depth","m3",900,380],["B1-C-02","Reinforced concrete C-25 in isolated footings","m3",180,14500],["B1-C-06","Reinforcement bars dia. 8-24 mm, cut, bent and fixed","kg",32000,145],["B1-M-01","Basaltic stone masonry foundation wall, mortar 1:4","m3",95,4600],["B2-C-03","Reinforced concrete C-25 in ribbed slabs","m3",420,15400],["B2-C-05","Reinforcement bars dia. 8-24 mm, cut, bent and fixed","kg",118000,145],["B4-R-01","EGA-300 pre-painted roof sheet, 0.4 mm","m2",480,1650],["B11-E-04","Earthing and lightning protection system","LS",1,380000]];
const TRADES=[["Concrete",44023200],["Finishing",12008500],["Sanitary",6544000],["Mechanical",6270000],["Masonry",5408500],["Metal work",5064000],["Electrical",4408000],["Painting",3368000],["Roofing",2329200],["Glazing",1838000],["Carpentry",1740000],["Earthwork",1338800]];
const CONTRACT=94340200;
const ACT=[ // id, name, start day, duration, critical
["M-000","Commencement of works",0,0,1],["PRE-MOB-010","Mobilization & site camp",0,18,1],["SUB-EXC-010","Bulk excavation",18,20,1],["SUB-CON-020","Isolated footings",38,34,1],
["SUB-MAS-010","Stone masonry wall",58,26,0],["SUB-CON-040","Grade beams",72,22,1],["SUB-CON-050","Ground floor slab",94,18,1],["SUP-GF-010","Ground floor columns",112,20,1],
["SUP-GF-020","First floor slab",132,34,1],["SUP-1F-020","Second floor slab",172,34,1],["SUP-2F-020","Third floor slab",212,34,1],["SUP-3F-020","Fourth floor slab",252,34,1],
["SUP-4F-020","Roof beams & slab",292,34,1],["FIN-MAS-010","External HCB walls",236,96,0],["MEP-ELE-010","Conduits & wiring",250,150,0],["SUP-RF-010","Roof sheeting",326,30,1],
["FIN-PLA-010","Internal plastering",356,70,1],["FIN-WIN-010","Windows & curtain wall",400,64,0],["FIN-TIL-010","Floor tiling",426,52,1],["MEP-LFT-010","Passenger lift",440,45,0],
["FIN-PNT-010","Internal painting",478,48,1],["CLS-SNG-010","Snagging & handover",526,44,1],["MS-END","Practical completion",570,0,1]];
const IPC=[0,3.325,7.109,10.262,13.925,18.418,23.654,26.948,31.953,38.607,46.615,56.115]; // cumulative measured, ETB M, Oct-25..Sep-26
const COST=[["Material",24776400,"#E8A447"],["Labour",10390400,"#5B8FE8"],["Plant",4794700,"#9FB6D9"],["Overhead",4235000,"#3E4A5C"]];
const COST_T=44196500;

// ===================== HELPERS =====================
const W=1080,H=1920;
const C=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,b)=>C((t-a)/(b-a));
const L=(a,b,x)=>a+(b-a)*x;
const E={
 oE:x=>x>=1?1:1-Math.pow(2,-10*x),
 ioE:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 oC:x=>1-Math.pow(1-x,3), iC:x=>x*x*x, ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 oQ:x=>1-Math.pow(1-x,5), ioS:x=>-(Math.cos(Math.PI*x)-1)/2,
 oB:x=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
const stage=document.getElementById('stage');
function h(tag,attrs={},parent,html){const e=tag.startsWith('svg:')?document.createElementNS('http://www.w3.org/2000/svg',tag.slice(4)):document.createElement(tag);
 for(const k in attrs){ if(k==='style') e.style.cssText=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; if(parent) parent.appendChild(e); return e;}
function tf(e,o){const {x=0,y=0,z=0,s=1,rx=0,ry=0,rz=0}=o;
 e.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${(o.sx??s).toFixed(4)},${(o.sy??s).toFixed(4)})`;
 if(o.o!==undefined) e.style.opacity=C(o.o).toFixed(4);
 if(o.b!==undefined) e.style.filter=o.b>0.08?`blur(${o.b.toFixed(2)}px)`:'none';}
function words(parent,text,cls,style){const wrap=h('div',{class:cls,style:style||''},parent);wrap.spans=[];
 text.split(' ').forEach((w,i)=>{ if(w==='/'){h('br',{},wrap);return;} let c='w'; if(w[0]==='*'){w=w.slice(1);c='w acc';}
   const s=h('span',{class:c},wrap); s.textContent=w; wrap.spans.push(s); wrap.appendChild(document.createTextNode(' '));});
 return wrap;}
function chars(parent,text,cls,style){const g=/\bgrad\b/.test(cls);const wrap=h('div',{class:cls.replace(/\bgrad\b/,''),style:style||''},parent);wrap.spans=[];
 [...text].forEach(ch=>{const s=h('span',{class:g?'ch grad':'ch'},wrap); s.textContent=ch===' '?' ':ch; wrap.spans.push(s);}); return wrap;}
function reveal(wrap,t,t0,{st=.08,d=1.2,dy=46,bl=16,ease=E.oE,sc=0}={}){wrap.spans.forEach((s,i)=>{const p=ease(P(t,t0+i*st,t0+i*st+d));
 tf(s,{y:(1-p)*dy,o:p,b:(1-p)*bl,s:1-(1-p)*sc});});}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const hash=(i,j)=>{let x=Math.sin(i*127.1+j*311.7)*43758.5453;return x-Math.floor(x);};

// ===================== BACKGROUND =====================
const bg=h('div',{class:'abs',style:'inset:0'},stage);
const orbs=[['rgba(31,95,173,.55)'],['rgba(217,142,43,.30)'],['rgba(15,42,68,.9)']].map(([c])=>h('div',{class:'orb',style:`background:radial-gradient(circle at 50% 50%,${c} 0%,transparent 62%)`},bg));
const scenes=[];
function scene(a,b,build,update,opt={}){const root=h('div',{class:'scene'},stage);const s={a,b,root,fi:opt.fi??.7,fo:opt.fo??.7,zin:opt.zin??1.05,zout:opt.zout??.94,amber:opt.amber??.4};build(root,s);s.update=update;scenes.push(s);return s;}
// overlays created after scenes (see bottom)

// ===================== S1 COLD OPEN =====================
scene(0,5.0,(r,s)=>{
 s.cv=h('canvas',{width:W,height:H,class:'abs',style:'left:0;top:0'},r); s.ctx=s.cv.getContext('2d');
 h('div',{class:'abs',style:'left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse 70% 22% at 50% 45%,rgba(2,3,7,.82),transparent 75%)'},r);
 s.lines=[words(r,'Every *birr.','h1 abs center'),words(r,'Every *day.','h1 abs center'),words(r,'Every *decision.','h1 abs center')];
 s.lines.forEach((w,i)=>w.style.top=(650+i*124)+'px');
},(t,lt,s)=>{
 drawGrid(s.ctx,lt);
 s.lines.forEach((w,i)=>{const t0=.45+i*1.1; reveal(w,lt,t0,{st:.12,d:1.4,dy:60,bl:22,sc:.04});
   w.style.opacity=(i<2?1-.62*E.ioC(P(lt,t0+1.1,t0+1.9)):1)*(1-E.iC(P(lt,4.2,4.95)));});
},{fi:.01,fo:.5,zout:1.12});
function drawGrid(ctx,lt){
 ctx.clearRect(0,0,W,H);
 const g=E.oC(P(lt,0,1.8)), warp=E.iC(P(lt,3.8,5.0));
 const zOff=lt*.55+warp*12, hor=560, F=980, Hc=1.05, cw=.95, ZF=26, rd=.2;
 ctx.save(); ctx.translate(540+Math.sin(lt*.4)*20,hor); ctx.rotate((-7+lt*1.1)*Math.PI/180);
 // horizon glow
 const hg=ctx.createRadialGradient(0,0,0,0,0,700); hg.addColorStop(0,`rgba(232,164,71,${.22*g})`); hg.addColorStop(.4,`rgba(91,143,232,${.10*g})`); hg.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=hg; ctx.fillRect(-1200,-500,2400,1000);
 const j0=Math.floor(zOff/rd);
 // highlighted cells
 for(let j=j0;j<j0+ZF/rd;j++){ const z0=j*rd-zOff, z1=z0+rd; if(z1<.25) continue;
   for(let i=-24;i<24;i++){ const hv=hash(i,j); if(hv>.06) continue;
     const za=Math.max(z0,.25), x0=i*cw, x1=x0+cw;
     const pulse=.55+.45*Math.sin(lt*2.2+hv*80); const fade=C(1-za/ZF)*g;
     const amber=hash(j,i)>.35; ctx.fillStyle=amber?`rgba(232,164,71,${.55*pulse*fade})`:`rgba(91,143,232,${.45*pulse*fade})`;
     ctx.beginPath(); ctx.moveTo(F*x0/za,F*Hc/za); ctx.lineTo(F*x1/za,F*Hc/za); ctx.lineTo(F*x1/z1,F*Hc/z1); ctx.lineTo(F*x0/z1,F*Hc/z1); ctx.closePath(); ctx.fill();
     if(amber && za<7){ // tiny data bar inside cell
       const zm=(za+z1)/2, bw=(F*cw/zm)*.55*(hash(i*3,j)*.6+.3), bx=F*(x0+cw*.12)/zm, by=F*Hc/zm, bh=Math.max(1,F*.08/zm);
       ctx.fillStyle=`rgba(255,240,215,${.6*fade*pulse})`; ctx.fillRect(bx,by-bh/2,bw,bh);} }}
 // row lines
 for(let j=j0;j<j0+ZF/rd;j++){const z=j*rd-zOff; if(z<.25) continue; const y=F*Hc/z, a=C(1-z/ZF)*.26*g*(j%5===0?1.9:1);
   ctx.strokeStyle=`rgba(200,215,235,${a})`; ctx.lineWidth=Math.min(2,.6+1.2/z); ctx.beginPath(); ctx.moveTo(-1400,y); ctx.lineTo(1400,y); ctx.stroke();}
 // column lines
 for(let i=-24;i<=24;i++){const x=i*cw; const zn=.25, zf=ZF; const gr=ctx.createLinearGradient(0,F*Hc/zn,0,F*Hc/zf);
   gr.addColorStop(0,`rgba(200,215,235,${.32*g})`); gr.addColorStop(1,'rgba(200,215,235,0)'); ctx.strokeStyle=gr; ctx.lineWidth=1.3;
   ctx.beginPath(); ctx.moveTo(F*x/zn,F*Hc/zn); ctx.lineTo(F*x/zf,F*Hc/zf); ctx.stroke();}
 ctx.restore();
 // fade to dark above horizon
 const tg=ctx.createLinearGradient(0,0,0,hor+120); tg.addColorStop(0,'rgba(2,3,7,1)'); tg.addColorStop(.75,'rgba(2,3,7,.6)'); tg.addColorStop(1,'rgba(2,3,7,0)');
 ctx.fillStyle=tg; ctx.fillRect(0,0,W,hor+120);
 if(warp>0){ctx.fillStyle=`rgba(255,236,205,${warp*.35})`; ctx.fillRect(0,0,W,H);}
}

// ===================== S2 LOGO =====================
scene(4.55,10.0,(r,s)=>{
 s.g=h('div',{class:'abs',style:'left:0;top:0;width:1080px;height:1920px;transform-origin:540px 650px'},r);
 s.glow=h('div',{class:'abs',style:'left:240px;top:350px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(232,164,71,.45),transparent 65%)'},s.g);
 s.svg=h('svg:svg',{width:240,height:240,viewBox:'0 0 240 240',style:'position:absolute;left:420px;top:530px;overflow:visible'},s.g);
 const defs=h('svg:defs',{},s.svg); const lg=h('svg:linearGradient',{id:'lgA',x1:0,y1:0,x2:1,y2:1},defs);
 h('svg:stop',{offset:'0','stop-color':'#FFD596'},lg); h('svg:stop',{offset:'1','stop-color':'#C9781D'},lg);
 s.rect=h('svg:rect',{x:8,y:8,width:224,height:224,rx:56,fill:'none',stroke:'url(#lgA)','stroke-width':7,pathLength:1,'stroke-dasharray':'1 1','stroke-linecap':'round'},s.svg);
 s.inner=h('svg:rect',{x:70,y:70,width:100,height:100,rx:22,fill:'url(#lgA)',style:'transform-origin:120px 120px'},s.svg);
 s.w1=chars(s.g,'Rapha','abs center grad','top:810px;font-size:190px;font-weight:800;letter-spacing:-.06em;line-height:1');
 s.w2=chars(s.g,'ProjectControl','abs center','top:1010px;font-size:86px;font-weight:300;letter-spacing:-.02em;color:#E7EBF0;line-height:1');
 s.ul=h('div',{class:'abs',style:'left:540px;top:1140px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#E8A447,transparent)'},s.g);
 s.sub=words(s.g,'Project control, reimagined.','abs center','top:1180px;font-size:42px;font-weight:500;color:#C9D1DC;letter-spacing:-.01em');
 s.am=words(s.g,'ራፋ ፕሮጀክት ቁጥጥር','abs center','top:1252px;font-size:36px;font-weight:500;color:#E8A447;letter-spacing:.02em');
},(t,lt,s)=>{
