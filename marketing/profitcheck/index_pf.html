<!doctype html>
<html><head><meta charset="utf-8"><title>ProfitCheck Ad</title>
<link rel="stylesheet" href="fonts_pc.css"><link rel="stylesheet" href="fonts2/fonts.css">
<style>
:root{--amber:#E8A447;--navy:#0F2A44;--red:#E5574B}
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Inter','Noto Sans Ethiopic',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#04070D}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;transform-origin:50% 50%}
.w{display:inline-block}
.et{font-family:'Noto Sans Ethiopic','Inter',sans-serif;letter-spacing:0}
.acc{background:linear-gradient(180deg,#FFD596 0%,#E8A447 55%,#C9781D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.mono{font-family:'JetBrains Mono',monospace}
.eyebrow{font-family:'JetBrains Mono';font-size:24px;font-weight:500;letter-spacing:.26em;color:var(--amber);text-transform:uppercase}
.dom{position:absolute;width:110px;height:420px;border-radius:16px;transform-origin:100% 100%;
 background:linear-gradient(170deg,#1B2A40,#0B1422 70%);border:2px solid rgba(232,164,71,.55);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 30px 60px rgba(0,0,0,.6)}
.dom .ic{position:absolute;left:15px;top:40px;width:80px;height:80px}
.dom .nm{position:absolute;left:0;width:110px;bottom:30px;text-align:center;font-family:'JetBrains Mono';font-size:22px;color:var(--amber)}
.dom .dot{position:absolute;left:47px;top:190px;width:16px;height:16px;border-radius:8px;background:rgba(232,164,71,.25)}
.cl{position:absolute;left:80px;height:84px;display:flex;align-items:center;gap:26px;font-family:'Noto Sans Ethiopic';font-weight:700;font-size:54px}
.cl i{width:22px;height:22px;border-radius:11px;background:var(--red);box-shadow:0 0 18px rgba(229,87,75,.8);flex:none}
.cl em{font-style:normal;font-family:'Inter';color:rgba(255,255,255,.35);font-weight:400;font-size:40px;margin-left:6px}
.win{position:absolute;border-radius:22px;overflow:hidden;background:#F4F6F8;box-shadow:0 40px 120px rgba(0,0,0,.65);color:#1B2430}
.win .hd{height:92px;background:#0F2A44;border-bottom:4px solid #D98E2B;padding:16px 26px;color:#fff}
.win .hd b{display:block;font-size:30px;font-weight:600}
.win .hd span{font-family:'Noto Sans Ethiopic';font-size:19px;color:#C9D3DF}
.tr{position:absolute;left:0;right:0;height:62px;display:flex;align-items:center;font-size:22px;border-bottom:1px solid #DDE3EA}
.tr div{padding:0 14px;white-space:nowrap;overflow:hidden}
.th{background:#E6EBF1;font-family:'JetBrains Mono';font-size:16px;letter-spacing:.06em;color:#5B6675;height:48px}
.inp{background:#FFF8E6;color:#1F4E9C;font-weight:600;border-bottom:2px solid #D98E2B}
.pn{position:absolute;width:470px;height:330px;border-radius:26px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);overflow:hidden}
.pn .t{position:absolute;left:26px;top:22px;font-family:'Noto Sans Ethiopic';font-weight:700;font-size:30px}
.pn .k{position:absolute;right:24px;top:28px;font-family:'JetBrains Mono';font-size:16px;color:#8C96A6;letter-spacing:.08em}
.pn .v{position:absolute;left:26px;bottom:24px;font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pn .s{position:absolute;left:26px;bottom:84px;font-family:'Noto Sans Ethiopic';font-size:20px;color:#9AA6B8}
.ok{position:absolute;right:22px;bottom:22px;width:54px;height:54px;border-radius:27px;background:#2E9D5F;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;box-shadow:0 0 24px rgba(46,157,95,.7)}
.cta{position:absolute;height:150px;border-radius:75px;background:linear-gradient(180deg,#FFD596,#E8A447 55%,#C9781D);display:flex;align-items:center;justify-content:center;gap:30px;
 box-shadow:0 30px 80px rgba(232,164,71,.35),inset 0 2px 0 rgba(255,255,255,.5);overflow:hidden}
.cta span{font-family:'Noto Sans Ethiopic';font-weight:900;font-size:60px;color:#141A24}
.cta b{font-weight:600;font-size:52px;color:#141A24}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 65% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%);pointer-events:none}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920;
const C=(x,a=0,b=1)=>x<a?a:x>b?b:x, P=(t,a,b)=>C((t-a)/(b-a)), L=(a,b,x)=>a+(b-a)*x;
const E={oE:x=>x>=1?1:1-Math.pow(2,-10*x),ioE:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 oC:x=>1-Math.pow(1-x,3),iC:x=>x*x*x,ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,oQ:x=>1-Math.pow(1-x,5),ioS:x=>-(Math.cos(Math.PI*x)-1)/2,
 oB:x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const stage=document.getElementById('stage');
function h(tag,attrs={},parent,html){const e=tag.startsWith('svg:')?document.createElementNS('http://www.w3.org/2000/svg',tag.slice(4)):document.createElement(tag);
 for(const k in attrs){ if(k==='style') e.style.cssText=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; if(parent) parent.appendChild(e); return e;}
function tf(e,o){const {x=0,y=0,z=0,s=1,rx=0,ry=0,rz=0}=o;
 e.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${(o.sx??s).toFixed(4)},${(o.sy??s).toFixed(4)})`;
 if(o.o!==undefined) e.style.opacity=C(o.o).toFixed(4); if(o.b!==undefined) e.style.filter=o.b>0.08?`blur(${o.b.toFixed(2)}px)`:'none';}
function words(parent,text,cls,style){const wrap=h('div',{class:cls,style:style||''},parent);wrap.spans=[];
 text.split(' ').forEach(w=>{ if(w==='/'){h('br',{},wrap);return;} let c='w'; if(w[0]==='*'){w=w.slice(1);c='w acc';}
   const s=h('span',{class:c},wrap); s.textContent=w; wrap.spans.push(s); wrap.appendChild(document.createTextNode(' '));}); return wrap;}
function reveal(wrap,t,t0,{st=.08,d=1.1,dy=50,bl=16,sc=0}={}){wrap.spans.forEach((s,i)=>{const p=E.oE(P(t,t0+i*st,t0+i*st+d)); tf(s,{y:(1-p)*dy,o:p,b:(1-p)*bl,s:1-(1-p)*sc});});}
const fmt=(n,d=0)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const scenes=[];
function scene(a,b,build,update,opt={}){const root=h('div',{class:'scene'},stage);const s={a,b,root,fi:opt.fi??.5,fo:opt.fo??.5,zin:opt.zin??1.05,zout:opt.zout??.95};build(root,s);s.update=update;scenes.push(s);return s;}
// background
const bg=h('div',{class:'abs',style:'inset:0'},stage);
const orbs=['rgba(31,95,173,.45)','rgba(217,142,43,.22)','rgba(15,42,68,.9)'].map(c=>h('div',{class:'abs',style:`width:1600px;height:1600px;left:-800px;top:-800px;border-radius:50%;background:radial-gradient(circle,${c} 0%,transparent 62%)`},bg));

h('style',{},document.head,`
#stage{background:#0B1D35}
.mt{font-family:'Montserrat',sans-serif}
.pcard{position:absolute;border-radius:36px;background:linear-gradient(165deg,rgba(40,58,84,.92),rgba(18,32,54,.95));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 50px 140px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.kt{position:absolute;width:440px;height:200px;border-radius:24px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);padding:24px 26px}
.kt .k{font-family:'Montserrat';font-weight:600;font-size:21px;letter-spacing:.06em;color:#9FB0C6}
.kt .v{font-family:'Montserrat';font-weight:800;font-size:70px;line-height:1.15;color:#fff;font-variant-numeric:tabular-nums}
.kt .v small{font-size:32px}
.kt .s{font-family:'Noto Sans Ethiopic';font-size:23px;color:#4FD1B5}
.tab{position:absolute;height:58px;padding:0 20px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(232,163,61,.45);display:flex;align-items:center;font-family:'Montserrat';font-weight:700;font-size:21px;white-space:nowrap}
.vp{position:absolute;height:72px;padding:0 30px;border-radius:36px;display:flex;align-items:center;gap:14px;font-family:'Montserrat';font-weight:800;font-size:28px;letter-spacing:.1em;white-space:nowrap}
.vp span{font-family:'Noto Sans Ethiopic';letter-spacing:0}
.chipin{position:absolute;height:96px;padding:0 34px;border-radius:48px;background:rgba(255,255,255,.07);border:1.5px solid rgba(232,163,61,.55);display:flex;align-items:center;gap:18px;font-family:'Noto Sans Ethiopic';font-weight:700;font-size:42px;white-space:nowrap}
.chipin i{font-style:normal;color:#E8A33D;font-family:'Montserrat';font-weight:800}
.ctab{position:absolute;height:150px;border-radius:75px;background:linear-gradient(180deg,#F5B54E,#E39A2C 60%,#C97F1A);display:flex;align-items:center;justify-content:center;gap:28px;box-shadow:0 30px 90px rgba(232,163,61,.45),inset 0 2px 0 rgba(255,255,255,.5);overflow:hidden}
.ctab span{font-family:'Noto Sans Ethiopic';font-weight:900;font-size:60px;color:#111A28}
.ctab b{font-family:'Montserrat';font-weight:700;font-size:52px;color:#111A28}
`);
const AMB='#E8A33D', TEAL='#2A9D8F', ROSE='#C44E52';
// blueprint grid background
const grid=h('div',{class:'abs',style:'left:-120px;top:-120px;width:1320px;height:2160px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px'},bg);
function wordmark(parent,top,size=56,left=72){return h('div',{class:'abs mt',style:`left:${left}px;top:${top}px;font-size:${size}px;font-weight:800;letter-spacing:-.02em;white-space:nowrap`},parent,`<span style="color:${AMB}">Profit</span>Check<span style="display:inline-block;width:${size*.22}px;height:${size*.22}px;background:${AMB};border-radius:${size*.04}px;margin-left:${size*.1}px"></span>`);}
function pill(parent,text,top){return h('div',{class:'abs mt',style:`right:72px;top:${top}px;height:60px;padding:0 28px;border-radius:30px;border:1.5px solid rgba(232,163,61,.5);background:rgba(255,255,255,.04);display:flex;align-items:center;font-size:19px;font-weight:800;letter-spacing:.2em;color:${AMB}`},parent,text);}

// ======================= 1 · HOOK: HALF-BUILT (0–3.2) =======================
scene(0,3.2,(r,s)=>{
 const S=h('svg:svg',{width:1080,height:1920,style:'position:absolute;left:0;top:0'},r); s.svg=S;
 const X0=300,X1=780,G=1640,FH=95;
 s.fl=[]; for(let i=0;i<9;i++){const y=G-(i+1)*FH; const g=h('svg:g',{},S);
   h('svg:path',{d:`M${X0} ${y} L${X1} ${y} M${X0} ${y} L${X0} ${y+FH} M${X1} ${y} L${X1} ${y+FH} `+[1,2,3,4,5].map(k=>`M${X0+k*80} ${y} L${X0+k*80} ${y+FH}`).join(' '),fill:'none',stroke:i<4?'rgba(220,230,245,.85)':'rgba(220,230,245,.18)','stroke-width':i<4?3:2,'stroke-dasharray':i<4?'none':'8 10'},g);
   if(i<4) for(let k=0;k<6;k++) h('svg:rect',{x:X0+k*80+14,y:y+20,width:52,height:55,fill:'rgba(232,163,61,.07)',stroke:'rgba(232,163,61,.35)','stroke-width':1.5},g);
   s.fl.push(g);}
 h('svg:path',{d:`M180 ${G} L900 ${G}`,stroke:'rgba(232,163,61,.6)','stroke-width':3},S);
 // rebar sticking out of the last finished slab
 s.rebar=h('svg:path',{d:[...Array(7)].map((_,k)=>`M${X0+k*80} ${G-4*FH} L${X0+k*80} ${G-4*FH-55}`).join(' '),stroke:'#E8A33D','stroke-width':4},S);
 // crane
 s.crane=h('svg:path',{d:'M880 1640 L880 560 M920 1640 L920 560 M880 560 L920 560 '+[...Array(21)].map((_,i)=>`M880 ${1630-i*52} L920 ${1580-i*52}`).join(' ')+' M560 580 L1080 580 M560 605 L1080 605 M900 560 L900 480 L580 580 M900 480 L1060 580',fill:'none',stroke:'rgba(160,178,205,.45)','stroke-width':2},S);
 s.hook=h('svg:path',{d:'M680 605 L680 860 M662 860 L698 860 M680 860 L680 880',stroke:'rgba(190,205,225,.7)','stroke-width':2.5,fill:'none'},S);
 s.q=h('div',{class:'abs mt',style:`left:470px;top:1110px;width:140px;height:140px;border-radius:70px;background:${ROSE};display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:800;box-shadow:0 0 60px rgba(196,78,82,.7)`},r,'?');
 s.t1=words(r,'አንድ ሕንፃ ግማሽ ላይ / ሲቆም *አይተው *ያውቃሉ?','abs et','left:72px;top:230px;font-size:84px;font-weight:800;line-height:1.28');
 s.t2=words(r,'ብዙ ጊዜ ችግሩ ያልተሰላው ቁጥር ነው።','abs et','left:0;width:1080px;text-align:center;top:1720px;font-size:40px;font-weight:600;color:#C9D4E3');
},(t,lt,s)=>{
 s.fl.forEach((g,i)=>{const t0=.15+i*.17, p=E.oC(P(lt,t0,t0+.4)); const done=i<4; g.style.opacity=(done?p:p*.9).toFixed(3); tf(g,{y:(1-p)*30});});
 s.rebar.style.opacity=C(P(lt,.9,1.1));
 s.crane.style.opacity=E.oC(P(lt,0,.6));
 s.hook.style.transformOrigin='680px 605px'; s.hook.style.transform=`rotate(${(Math.sin(lt*2.2)*4*(1-C(P(lt,1.2,2.2)))).toFixed(2)}deg)`;
 tf(s.q,{s:E.oB(P(lt,1.5,2.0)),o:C(P(lt,1.5,1.62))});
 reveal(s.t1,lt,.2,{st:.1,d:1.0,dy:60,bl:20});
 reveal(s.t2,lt,1.7,{st:.07,dy:24});
 tf(s.svg,{s:1+lt*.015});
},{fi:.01,fo:.35,zout:1.05});

// ======================= 2 · HEADLINE + INPUTS (2.9–6.4) =======================
scene(2.9,6.4,(r,s)=>{
 s.h1=words(r,'ፕሮጀክትዎ / ያተርፋል?','abs et','left:72px;top:230px;font-size:140px;font-weight:900;line-height:1.18');
 s.h2=words(r,'*ከመገንባትዎ *በፊት *ይወቁ።','abs et','left:72px;top:590px;font-size:84px;font-weight:900');
 s.rule=h('div',{class:'abs',style:'left:72px;top:735px;width:560px;height:2px;background:linear-gradient(90deg,rgba(232,163,61,.8),transparent);transform-origin:0 50%'},r);
 const CH=[['የግንባታ ወጪ','₿',-1,830],['ሽያጭ','%',1,960],['ኪራይ','↻',-1,1090],['ብድር','⇄',1,1220]];
 s.chips=CH.map(([tx,ic,side,y],i)=>{const d=h('div',{class:'chipin',style:`top:${y}px;${side<0?'left:72px':'right:72px'}`},r,`<i>${['01','02','03','04'][i]}</i>${tx}`); d.side=side; d.i=i; return d;});
 s.core=h('div',{class:'abs',style:'left:340px;top:1420px;width:400px;height:160px;border-radius:40px;background:rgba(232,163,61,.12);border:2px solid rgba(232,163,61,.8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(232,163,61,.35)'},r);
 wordmark(s.core,48,52,0).style.cssText+=';position:static';
},(t,lt,s)=>{
 reveal(s.h1,lt,.1,{st:.12,d:1.0,dy:70,bl:22,sc:.04});
 reveal(s.h2,lt,.75,{st:.12,d:1.0,dy:50,bl:18});
 s.rule.style.transform=`scaleX(${E.oE(P(lt,1.1,2.0)).toFixed(4)})`;
 s.chips.forEach(d=>{const t0=1.0+d.i*.18, p=E.oE(P(lt,t0,t0+.8)), m=E.iC(P(lt,2.35+d.i*.06,2.95));
   const cy=1500-(830+d.i*130)-48;
   tf(d,{x:(1-p)*d.side*-300 + m*(d.side<0? 220:-220),y:m*cy,s:1-.5*m,o:p*(1-m)});});
 const pc=E.oB(P(lt,2.55,3.2)); tf(s.core,{s:.6+.4*pc,o:C(P(lt,2.4,2.7))});
 s.core.style.boxShadow=`0 0 ${(80+60*Math.sin(Math.PI*P(lt,2.8,3.5))).toFixed(0)}px rgba(232,163,61,.45)`;
},{fi:.35,fo:.4});

// ======================= 3 · VERDICT DASHBOARD (6.1–10.7) =======================
const V3=[['NOT VIABLE','አዋጭ ያልሆነ',ROSE],['MARGINAL','በድንበር ላይ',AMB],['VIABLE','አዋጭ',TEAL]];
scene(6.1,10.7,(r,s)=>{
 s.card=h('div',{class:'pcard',style:'left:50px;top:230px;width:980px;height:1150px'},r);
 h('div',{class:'abs et',style:'left:40px;top:44px;font-size:30px;font-weight:700;color:#B8C6D8'},s.card,'B+G+8 ቅይጥ አገልግሎት · ናሙና');
 s.vp=h('div',{class:'vp',style:'right:36px;top:30px'},s.card,'');
 const K=[['EQUITY IRR',24.6,'%','ከ20% ግብ በላይ',1],['PROFIT ON COST',31,'%','ትርፍ በወጪ',0],['MIN DSCR',1.42,'x','ከ1.25x በላይ',2],['PAYBACK',6.2,' yrs','የመመለሻ ጊዜ',1]];
 s.kts=K.map((k,i)=>{const d=h('div',{class:'kt',style:`left:${40+(i%2)*460}px;top:${140+Math.floor(i/2)*220}px`},s.card,`<div class="k">${k[0]}</div><div class="v">0</div><div class="s">${k[3]}</div>`); d.v=d.querySelector('.v'); d.k=k; return d;});
 // cash flow bars + cumulative line
 const BX=40,BY=770,BW=900; const vals=[-1.0,-1.8,-1.4,.45,1.0,.9,.85,.9,.95,1.0,1.05,1.1,1.8];
 s.bars=vals.map((v,i)=>{const w=54, x=BX+i*(BW/13)+6, hh=Math.abs(v)*90; const d=h('div',{class:'abs',style:`left:${x}px;top:${v<0?BY:BY-hh}px;width:${w}px;height:${hh}px;border-radius:4px;background:${v<0?'#B5444A':'#2A9D8F'};transform-origin:50% ${v<0?'0':'100%'}`},s.card); d.i=i; return d;});
 h('div',{class:'abs',style:`left:${BX}px;top:${BY}px;width:${BW}px;height:2px;background:rgba(255,255,255,.18)`},s.card);
 let cum=0; const pts=vals.map((v,i)=>{cum+=v; return [BX+i*(BW/13)+33, BY-cum*26+20];});
 s.lsvg=h('svg:svg',{width:980,height:1150,style:'position:absolute;left:0;top:0;overflow:visible'},s.card);
 s.line=h('svg:path',{d:'M'+pts.map(p=>p.join(' ')).join(' L'),fill:'none',stroke:AMB,'stroke-width':4,pathLength:1,'stroke-dasharray':'1 1','stroke-linejoin':'round'},s.lsvg);
 s.ldot=h('svg:circle',{cx:pts[12][0],cy:pts[12][1],r:12,fill:AMB,style:'filter:drop-shadow(0 0 10px #E8A33D)'},s.lsvg);
 const TB=[['P&L',40,1040],['Balance Sheet',156,1040],['Cash Flow',366,1040],['የብድር ሰንጠረዥ',536,1040],['Sensitivity',40,968],['Break-even',236,968]];
 s.tabs=TB.map(([tx,x,y],i)=>h('div',{class:'tab',style:`left:${x}px;top:${y}px;${/[ሀ-፿]/.test(tx)?"font-family:'Noto Sans Ethiopic'":''}`},s.card,tx));
