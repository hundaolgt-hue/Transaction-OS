<!doctype html>
<html><head><meta charset="utf-8"><title>Rapha Motion Template</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ---- brand tokens: swap per product (see references/brands.md) ---- */
:root{--bg:#0B1D35;--accent:#E8A33D;--accent-hi:#FFD596;--accent-lo:#C9781D;--good:#2A9D8F;--bad:#C44E52;--ink:#fff;--mute:#9FB0C6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
body{font-family:'Inter','Noto Sans Ethiopic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none;transform-origin:50% 50%}
.w{display:inline-block}                       /* every animated word is its own inline-block */
.et{font-family:'Noto Sans Ethiopic','Inter',sans-serif;letter-spacing:0}  /* never negative tracking on Ethiopic */
.mt{font-family:'Montserrat',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}  /* Latin only: Ethiopic in mono falls back to tofu */
.acc{background:linear-gradient(180deg,var(--accent-hi) 0%,var(--accent) 55%,var(--accent-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.card{position:absolute;border-radius:36px;background:linear-gradient(165deg,rgba(40,58,84,.92),rgba(18,32,54,.95));border:1.5px solid rgba(255,255,255,.14);box-shadow:0 50px 140px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.kpi{position:absolute;width:440px;height:200px;border-radius:24px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);padding:24px 26px}
.kpi .k{font-family:'Montserrat';font-weight:600;font-size:21px;letter-spacing:.06em;color:var(--mute)}
.kpi .v{font-family:'Montserrat';font-weight:800;font-size:70px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-family:'Noto Sans Ethiopic';font-size:23px;color:#4FD1B5}
.cta{position:absolute;height:150px;border-radius:75px;background:linear-gradient(180deg,#F5B54E,#E39A2C 60%,#C97F1A);display:flex;align-items:center;justify-content:center;gap:28px;box-shadow:0 30px 90px rgba(232,163,61,.45),inset 0 2px 0 rgba(255,255,255,.5);overflow:hidden}
.cta span{font-family:'Noto Sans Ethiopic';font-weight:900;font-size:60px;color:#111A28}
.cta b{font-weight:700;font-size:52px;color:#111A28}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 65% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%);pointer-events:none}
</style></head>
<body><div id="stage"></div>
<script>
// ============================ ENGINE (keep) ============================
const W=1080,H=1920;
const C=(x,a=0,b=1)=>x<a?a:x>b?b:x, P=(t,a,b)=>C((t-a)/(b-a)), L=(a,b,x)=>a+(b-a)*x;
const E={oE:x=>x>=1?1:1-Math.pow(2,-10*x), ioE:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 oC:x=>1-Math.pow(1-x,3), iC:x=>x*x*x, ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, oQ:x=>1-Math.pow(1-x,5), ioS:x=>-(Math.cos(Math.PI*x)-1)/2,
 oB:x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};   // oE/oQ = slow-mo glide, oB = pop
const stage=document.getElementById('stage');
function h(tag,attrs={},parent,html){const e=tag.startsWith('svg:')?document.createElementNS('http://www.w3.org/2000/svg',tag.slice(4)):document.createElement(tag);
 for(const k in attrs){ if(k==='style') e.style.cssText=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; if(parent) parent.appendChild(e); return e;}
function tf(e,o){const {x=0,y=0,z=0,s=1,rx=0,ry=0,rz=0}=o;
 e.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${(o.sx??s).toFixed(4)},${(o.sy??s).toFixed(4)})`;
 if(o.o!==undefined) e.style.opacity=C(o.o).toFixed(4); if(o.b!==undefined) e.style.filter=o.b>0.08?`blur(${o.b.toFixed(2)}px)`:'none';}
// words(): "*word" = accent gradient word, a lone "/" token = line break. For a literal slash write "word/" (attached).
function words(parent,text,cls,style){const wrap=h('div',{class:cls,style:style||''},parent);wrap.spans=[];
 text.split(' ').forEach(w=>{ if(w==='/'){h('br',{},wrap);return;} let c='w'; if(w[0]==='*'){w=w.slice(1);c='w acc';}
   const s=h('span',{class:c},wrap); s.textContent=w; wrap.spans.push(s); wrap.appendChild(document.createTextNode(' '));}); return wrap;}
// chars(): per-letter reveal. Gradient class goes on each span (clip-to-text on a parent breaks once children transform).
function chars(parent,text,cls,style){const g=/\bacc\b/.test(cls);const wrap=h('div',{class:cls.replace(/\bacc\b/,''),style:style||''},parent);wrap.spans=[];
 [...text].forEach(ch=>{const s=h('span',{class:g?'w acc':'w'},wrap); s.textContent=ch===' '?' ':ch; wrap.spans.push(s);}); return wrap;}
function reveal(wrap,t,t0,{st=.08,d=1.1,dy=50,bl=16,sc=0}={}){wrap.spans.forEach((s,i)=>{const p=E.oE(P(t,t0+i*st,t0+i*st+d)); tf(s,{y:(1-p)*dy,o:p,b:(1-p)*bl,s:1-(1-p)*sc});});}
const fmt=(n,d=0)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const scenes=[];
// scene(a,b,build,update,{fi,fo,zin,zout}): visible between a and b; overlapping neighbours by ~0.3 s gives blur-crossfades.
function scene(a,b,build,update,opt={}){const root=h('div',{class:'scene'},stage);const s={a,b,root,fi:opt.fi??.4,fo:opt.fo??.4,zin:opt.zin??1.05,zout:opt.zout??.95};build(root,s);s.update=update;scenes.push(s);return s;}
const bg=h('div',{class:'abs',style:'inset:0'},stage);
const grid=h('div',{class:'abs',style:'left:-120px;top:-120px;width:1320px;height:2160px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px'},bg);
const orbs=['rgba(31,95,173,.45)','rgba(232,163,61,.20)','rgba(15,42,68,.9)'].map(c=>h('div',{class:'abs',style:`width:1600px;height:1600px;left:-800px;top:-800px;border-radius:50%;background:radial-gradient(circle,${c} 0%,transparent 62%)`},bg));
const shimmer=(parent,hh)=>h('div',{class:'abs',style:`left:-400px;top:-50px;width:200px;height:${hh+100}px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);mix-blend-mode:soft-light`},parent);

// ============================ SCENES (replace) ============================
// 1 · HOOK — kinetic headline (problem first, product later)
scene(0,3.4,(r,s)=>{
 s.l1=words(r,'ፕሮጀክትዎ / ያተርፋል?','abs et','left:72px;top:600px;font-size:140px;font-weight:900;line-height:1.18');
 s.l2=words(r,'*ከመገንባትዎ *በፊት *ይወቁ።','abs et','left:72px;top:960px;font-size:84px;font-weight:900');
},(t,lt,s)=>{
 reveal(s.l1,lt,.2,{st:.12,d:1.0,dy:70,bl:22,sc:.04});
 reveal(s.l2,lt,1.0,{st:.12,d:1.0,dy:50,bl:18});
},{fi:.01});

// 2 · PROOF — 3D card settles, KPIs count up (use REAL numbers from the source files)
scene(3.1,8.0,(r,s)=>{
 s.card=h('div',{class:'card',style:'left:50px;top:420px;width:980px;height:640px'},r);
 h('div',{class:'abs et',style:'left:40px;top:40px;font-size:30px;font-weight:700;color:var(--mute)'},s.card,'ናሙና ፕሮጀክት');
 const K=[['EQUITY IRR',24.6,'%',1],['PROFIT ON COST',31,'%',0],['MIN DSCR',1.42,'x',2],['PAYBACK',6.2,' yrs',1]];
 s.k=K.map((k,i)=>{const d=h('div',{class:'kpi',style:`left:${40+(i%2)*460}px;top:${120+Math.floor(i/2)*230}px`},s.card,`<div class="k">${k[0]}</div><div class="v">0</div>`); d.v=d.querySelector('.v'); d.d=k; return d;});
 s.cap=words(r,'ውጤቱ በአንድ *ገጽ።','abs et','left:0;width:1080px;text-align:center;top:1180px;font-size:56px;font-weight:800');
},(t,lt,s)=>{
 const p=E.oQ(P(lt,0,2.4)); tf(s.card,{rx:L(26,0,p)+Math.sin(lt*.8)*.8,y:L(200,0,p),s:L(.94,1,p),o:E.oC(P(lt,0,.5))});
 s.k.forEach((d,i)=>{const t0=.6+i*.14, pp=E.oE(P(lt,t0,t0+.9)); tf(d,{y:(1-pp)*40,o:pp}); const c=E.ioC(P(lt,t0,t0+1.3)); d.v.textContent=(d.d[1]*c).toFixed(d.d[3])+d.d[2];});
 reveal(s.cap,lt,2.0,{st:.1,dy:30});
});

// 3 · CTA — wordmark + gold button with shimmer and nudging arrow
scene(7.7,11.0,(r,s)=>{
 s.wm=h('div',{class:'abs mt',style:'left:0;width:1080px;text-align:center;top:700px;font-size:140px;font-weight:800'},r,'<span style="color:var(--accent)">Profit</span>Check');
 s.cta=h('div',{class:'cta',style:'left:190px;top:1150px;width:700px'},r,'<span>አሁኑኑ ያዉርዱ</span><b>→</b>'); s.arrow=s.cta.lastChild; s.sh=shimmer(s.cta,150);
},(t,lt,s)=>{
 const pw=E.oE(P(lt,.1,1.1)); tf(s.wm,{s:.85+.15*pw,o:pw,b:(1-pw)*18});
 const pc=E.oB(P(lt,.9,1.5)); tf(s.cta,{s:.6+.4*pc,o:C(P(lt,.9,1.1))});
 s.sh.style.left=(-400+E.ioC(P(lt,1.5,2.3))*1400)+'px';
 tf(s.arrow,{x:lt>1.8?10*Math.max(0,Math.sin((lt-1.8)*6)):0});
},{fo:.4,zout:1});

// ============================ RENDER LOOP (keep) ============================
h('div',{id:'vig'},stage);
const flash=h('div',{class:'abs',style:'inset:0;background:#fff;opacity:0;mix-blend-mode:screen'},stage);
const DURATION=11.0, CUTS=[3.25,7.85];             // CUTS: scene boundaries → soft white flash (match the score's impacts)
window.renderAt=function(t){
 tf(grid,{x:-(t*6)%60,y:-(t*9)%60});
 const a=t*.15;
 tf(orbs[0],{x:200+Math.sin(a)*160,y:300+Math.cos(a*.8)*140});
 tf(orbs[1],{x:880+Math.cos(a*.9)*150,y:1650+Math.sin(a*1.1)*120});
 tf(orbs[2],{x:540+Math.sin(a*.6)*220,y:1000+Math.cos(a*.5)*260});
 for(const s of scenes){
  if(t<s.a||t>s.b){s.root.style.display='none';continue;}
  s.root.style.display='block';
  const lt=t-s.a, ei=E.oC(P(t,s.a,s.a+s.fi)), eo=E.iC(P(t,s.b-s.fo,s.b));
  s.root.style.opacity=(ei*(1-eo)).toFixed(4);
  s.root.style.transform=`scale(${(L(s.zin,1,ei)*L(1,s.zout,eo)).toFixed(4)})`;
  const bl=(1-ei)*12+eo*16; s.root.style.filter=bl>.1?`blur(${bl.toFixed(2)}px)`:'none';
  s.update(t,lt,s);
 }
 flash.style.opacity=(CUTS.reduce((m,x)=>Math.max(m,1-Math.abs(t-x)/.22),0)*.14).toFixed(3);
 stage.style.opacity=(1-P(t,DURATION-.4,DURATION)).toFixed(3);
};
window.DURATION=DURATION;
</script></body></html>
